# Manual (not generated by WordPress Local Dev). In conf.d/manual/ because the tool deletes conf.d/*.conf files of projects it does not run.
# Project: betting.se community-platform | Domain: local.betting.se | Upstream: web84 on host port 127.0.0.1:8497
# The upstream is the published host port, not the project network: no `docker network connect`, so a restart or `docker compose down` on either side needs no action.

# Keepalive: Docker Desktop's host-port forwarder drops some new connections under load (504 "timed out while connecting").
# host.docker.internal always resolves on Docker Desktop, so a static upstream cannot block nginx start or reload.
upstream betting_se_web84 {
    server host.docker.internal:8497;
    keepalive 16;
}

server {
    listen 80;
    server_name local.betting.se;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name local.betting.se;

    ssl_certificate /etc/nginx/project-ssl/betting-se/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/project-ssl/betting-se/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location / {
        # web84 serves HTTPS only (its port 80 redirects to :8497); its self-signed certificate is not verified (proxy_ssl_verify is off by default).
        proxy_pass https://betting_se_web84;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
